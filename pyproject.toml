[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-to-strava"
version = "0.2.0"
description = "Migrate Polar Flow training exports to Strava with FIT or TCX."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'", "fit-tool==0.9.16", "httpx>=0.27,<1", "lxml>=5.2,<7", "pydantic>=2.7,<3", "PyYAML>=6.0,<7", "rich>=13.7,<14", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["black>=24.0,<26", "lxml-stubs>=0.5,<1", "mypy>=1.10,<2", "pytest>=8.0,<9", "ruff>=0.5,<1", "types-PyYAML>=6.0", "jsonschema>=4.20,<5", "types-jsonschema>=4.20"]

[project.scripts]
polar-to-strava = "core.cli:app"
polar-to-strava-engine = "integration.engine:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["config", "core", "db", "domain", "fit", "integration", "polar", "services", "strava", "tcx"]

[tool.setuptools]
packages = ["config", "core", "db", "domain", "fit", "integration", "polar", "serialization", "services", "strava", "tcx", "tcx.serializers"]

[tool.setuptools.package-data]
tcx = ["*.xsd"]
