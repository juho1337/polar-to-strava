[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-to-strava"
version = "0.1.0"
description = "Convert Polar Flow JSON exports to Garmin TCX."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "lxml>=5.2,<7", "pydantic>=2.7,<3", "PyYAML>=6.0,<7", "rich>=13.7,<14", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["black>=24.0,<26", "mypy>=1.10,<2", "pytest>=8.0,<9", "ruff>=0.5,<1", "types-PyYAML>=6.0"]

[project.scripts]
polar-to-strava = "core.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["config", "core", "db", "domain", "polar", "services", "strava", "tcx"]

[tool.setuptools]
packages = ["config", "core", "db", "domain", "polar", "strava", "tcx"]
